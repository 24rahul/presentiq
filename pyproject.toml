[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Provider configuration must load before modules construct their shared limits.
"app.py" = ["E402"]
"api_server.py" = ["E402"]
"tests/test_api.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
